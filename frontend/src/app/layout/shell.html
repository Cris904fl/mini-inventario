<div class="marco">
  <aside class="lateral">
    <a class="marca" routerLink="/resumen">
      <span class="marca-sello mono">KX</span>
      <span class="marca-texto">
        <strong>Kárdex</strong>
        <small>control de inventario</small>
      </span>
    </a>

    <nav class="nav">
      @for (s of secciones(); track s.ruta) {
        <a [routerLink]="s.ruta" routerLinkActive="activa" class="nav-item">
          <ng-container *ngTemplateOutlet="icono; context: { $implicit: s.icono }" />
          <span>{{ s.nombre }}</span>
        </a>
      }
    </nav>

    <div class="usuario">
      <span class="rotulo">Sesión</span>
      <strong>{{ auth.nombreCompleto() || auth.usuario() }}</strong>
      <span class="pequeno silencio mono">&#64;{{ auth.usuario() }} · {{ auth.rol() }}</span>
      <div class="acciones-usuario">
        <app-tema-selector />
        <a routerLink="/cambiar-clave" class="boton-icono" aria-label="Cambiar clave" title="Cambiar clave">
          <svg class="icono" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="7" cy="10" r="3.5" /><path d="M10.5 10H17m-2.5 0v2.5M13 10v2" />
          </svg>
        </a>
        <button type="button" class="boton-icono" (click)="salir()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg class="icono" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M8 3.5H4.5v13H8M12.5 6.5 16 10l-3.5 3.5M16 10H7.5" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <header class="superior">
    <a class="marca" routerLink="/resumen">
      <span class="marca-sello mono">KX</span>
      <strong>Kárdex</strong>
    </a>
    <div class="acciones-superior">
      <app-tema-selector />
      <a routerLink="/cambiar-clave" class="boton-icono" aria-label="Cambiar clave" title="Cambiar clave">
        <svg class="icono" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="7" cy="10" r="3.5" /><path d="M10.5 10H17m-2.5 0v2.5M13 10v2" />
        </svg>
      </a>
      <button type="button" class="boton-icono" (click)="salir()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg class="icono" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M8 3.5H4.5v13H8M12.5 6.5 16 10l-3.5 3.5M16 10H7.5" />
        </svg>
      </button>
    </div>
  </header>

  <main class="contenido">
    <router-outlet />
  </main>

  @if (secciones().length > 0) {
    <nav class="inferior" [style.grid-template-columns]="'repeat(' + secciones().length + ', 1fr)'">
      @for (s of secciones(); track s.ruta) {
        <a [routerLink]="s.ruta" routerLinkActive="activa" class="inferior-item">
          <ng-container *ngTemplateOutlet="icono; context: { $implicit: s.icono }" />
          <span>{{ s.nombre }}</span>
        </a>
      }
    </nav>
  }
</div>

<ng-template #icono let-nombre>
  <svg class="icono" viewBox="0 0 20 20" aria-hidden="true">
    @switch (nombre) {
      @case ('resumen') {
        <path d="M3.5 16.5h13M5 14V9M9 14V5M13 14v-3M17 14V7" />
      }
      @case ('inventario') {
        <path d="M3 6.5 10 3l7 3.5v7L10 17l-7-3.5v-7Z M3 6.5l7 3.5 7-3.5 M10 10v7" />
      }
      @case ('movimiento') {
        <path d="M4 7h12m0 0-3-3m3 3-3 3 M16 13H4m0 0 3-3m-3 3 3 3" />
      }
      @case ('historial') {
        <path d="M4 5h12M4 10h12M4 15h8" />
      }
      @case ('usuarios') {
        <path d="M10 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M4 17c0-3 2.7-5 6-5s6 2 6 5" />
      }
    }
  </svg>
</ng-template>
